[build-system]
# PEP 517 build backend + pinned toolchain from MODERN3_REFERENCE_ENVIRONMENT.md.
# build 1.5.0 (1.5.1 is YANKED). Cython 3.2.x (not 3.1+). NumPy 2.5.x.
requires = [
    "setuptools>=64",
    "wheel==0.48.0",
    "Cython>=3.2,<3.3",
    "numpy>=2.5,<3",
]
build-backend = "setuptools.build_meta"

[project]
name = "msbwt-modern3"
version = "0.3.0"
description = "Multi-string BWT merging and querying for genomic strings (Python 3 modernization)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "James Holt", email = "holtjma@cs.unc.edu" },
]

# Core dependencies. pysam is conditional: it has NO native-Windows build
# (pysam maintainer: "does not currently support Windows"), so it is excluded
# on win32 via the PEP 508 platform marker. Core FASTQ/FASTA construction,
# query, compression, decompression, and merge work without pysam. BAM
# preprocessing is unavailable on native Windows and fails clearly.
dependencies = [
    "numpy>=2.5,<3",
    "pysam>=0.24; sys_platform != 'win32'",
]

[project.urls]
Homepage = "http://code.google.com/p/msbwt"

[project.optional-dependencies]
# Explicit opt-in for BAM support on platforms where pysam builds (Linux/macOS).
bam = ["pysam>=0.24"]

[project.scripts]
# Legacy CLI (single dispatcher; cffq, pp, cfpp, merge, query, massquery,
# compress, decompress, convert are its subcommands). Deferred in M3-1.
msbwt = "_deferred_cli:ms_main"
# Enhanced console scripts (deferred in M3-1).
msbwt-bwt-tags = "_deferred_cli:bwt_tags"
msbwt-lcp = "_deferred_cli:lcp"
msbwt-quality-sidecar = "_deferred_cli:quality_sidecar"
msbwt-remove-sources = "_deferred_cli:remove_sources"
msbwt-retrofit-read-provenance = "_deferred_cli:retrofit_read_provenance"
msbwt-benchmark-index = "_deferred_cli:benchmark_index"

[tool.setuptools]
packages = ["MUS", "MUSCython"]
py-modules = ["_deferred_cli"]
# BasicBWT.pxd (and any future .pxd) becomes package data in M3-3.
package-data = { "MUSCython" = ["*.pxd"] }
zip-safe = false
